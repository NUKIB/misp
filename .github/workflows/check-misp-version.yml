name: Check External Release
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  check-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get latest release
        id: release
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: 'MISP',
              repo: 'MISP'
            });
            return release.tag_name;

      - name: Compare with stored version
        id: compare
        run: |
          LAST_VERSION=$(cat MISP_VERSION 2>/dev/null || echo "")
          NEW_VERSION="${{ steps.release.outputs.result }}"
          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          if [ "$LAST_VERSION" != "$NEW_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "New MISP release detected: $NEW_VERSION"
            echo "$NEW_VERSION" > MISP_VERSION
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit version file
        if: steps.compare.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update MISP version to ${{ steps.compare.outputs.new_version }}'
          file_pattern: MISP_VERSION